# Entorno de desarrollo completo  —  Pb-05
#
#   docker compose up
#
# Levanta cuatro servicios:
#   db     PostgreSQL 17        localhost:5432
#   redis  Redis 7              localhost:6379
#   api    FastAPI con recarga  http://localhost:8000/api/docs
#   mock   Prism                http://localhost:4010
#
# El mock sirve el contrato congelado de docs/api/openapi.json. Web y Movil
# apuntan ahi mientras el backend no tenga implementado su caso de uso, y
# cambian a la API real con una sola variable de entorno.
#
# El worker de vision NO esta aca: corre fuera de Docker, en la maquina con
# GPU, por los controladores de NVIDIA. Ver vision/README.md

name: areatecnica

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: areatecnica
      POSTGRES_PASSWORD: areatecnica
      POSTGRES_DB: areatecnica
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U areatecnica"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://areatecnica:areatecnica@db:5432/areatecnica
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: clave-solo-para-desarrollo-no-usar-en-produccion
      CORS_ORIGINS: http://localhost:5173,http://localhost:4010
      SEED_DEMO_DATA: "true"
      DEMO_ADMIN_EMAIL: admin@club-demo.example.com
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Demo-Area-Tecnica-2026}
    ports:
      - "8000:8000"
    volumes:
      # Montar el codigo da recarga en caliente sin reconstruir la imagen
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
    # Aplica las migraciones pendientes y recien despues arranca la API
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_dev &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mock:
    image: stoplight/prism:5
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docs/api:/contrato:ro
    ports:
      - "4010:4010"
    # Prism 5.15.10 falla con Node 24 en su modo multiproceso (isPrimary).
    # La imagen ya incluye el ENTRYPOINT; solo se pasan el subcomando y opciones.
    command:
      - mock
      - /contrato/openapi.json
      - --host
      - 0.0.0.0
      - --port
      - "4010"
      - --dynamic
      - --multiprocess=false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4010/api/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  datos_db:
