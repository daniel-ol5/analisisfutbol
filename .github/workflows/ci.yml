# Integracion continua  —  Pb-06
#
# Corre en cada Pull Request y en cada push a main. Un PR con esto en rojo
# queda bloqueado para integrar.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks revisa todo el historial, no solo el ultimo commit

      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  backend:
    name: Backend · lint y pruebas (PostgreSQL 16)
    runs-on: ubuntu-latest
    # Base exclusiva y efimera de esta corrida: no es una credencial real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci${{ github.run_id }}x${{ github.run_attempt }}
          POSTGRES_DB: areatecnica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci${{ github.run_id }}x${{ github.run_attempt }}@localhost:5432/areatecnica_test
      DATABASE_URL: postgresql+asyncpg://postgres:ci${{ github.run_id }}x${{ github.run_attempt }}@localhost:5432/areatecnica_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        working-directory: backend
        run: ruff check app scripts tests

      - name: Pruebas
        working-directory: backend
        run: python -m pytest

      - name: El contrato OpenAPI esta al dia
        working-directory: backend
        run: |
          python scripts/exportar_openapi.py
          if ! git diff --quiet ../docs/api/openapi.json; then
            echo "::error::docs/api/openapi.json quedo desactualizado."
            echo "Corre 'python scripts/exportar_openapi.py' y commitea el resultado."
            git diff --stat ../docs/api/openapi.json
            exit 1
          fi

  web:
    name: Web · tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Auditar dependencias
        working-directory: web
        run: npm run audit:ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build y verificacion de tipos
        working-directory: web
        run: npm run build

  movil:
    name: Movil · analyze y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: movil
        run: flutter pub get

      - name: Analyze
        working-directory: movil
        run: flutter analyze

      - name: Build
        working-directory: movil
        run: flutter build web --release

  e2e:
    # T-093 (Alejandra): los tres flujos criticos de punta a punta con Playwright,
    # contra PostgreSQL, el backend y la web levantados de verdad. Ver web/e2e/README.md.
    name: E2E · calibracion, partido en vivo y video (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base exclusiva y efimera de esta corrida: no es una credencial real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e${{ github.run_id }}x${{ github.run_attempt }}
          POSTGRES_DB: areatecnica_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:e2e${{ github.run_id }}x${{ github.run_attempt }}@localhost:5432/areatecnica_e2e
      DB_NULL_POOL: "true"
      CORS_ORIGINS: http://127.0.0.1:5180
      VIDEOS_DIR: ${{ runner.temp }}/e2e/videos
      E2E_DATOS: ${{ runner.temp }}/e2e/datos.json
      E2E_PYTHON: python
      E2E_WEB_URL: http://127.0.0.1:5180
      E2E_API_URL: http://127.0.0.1:8100/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias de la web y Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Migraciones y datos de prueba
        working-directory: backend
        env:
          E2E_SEMBRAR: "1"
        run: |
          alembic upgrade head
          python scripts/sembrar_e2e.py --salida "$E2E_DATOS" --video "${{ runner.temp }}/e2e/clip.mp4"

      - name: Levantar el backend y la web
        run: |
          (cd backend && nohup uvicorn app.main:app --host 127.0.0.1 --port 8100 > "${{ runner.temp }}/backend.log" 2>&1 &)
          (cd web && VITE_API_URL="$E2E_API_URL" nohup npx vite --host 127.0.0.1 --port 5180 --strictPort > "${{ runner.temp }}/web.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8100/api/docs > /dev/null && curl -sf "$E2E_WEB_URL" > /dev/null; then
              echo "Backend y web listos"; exit 0
            fi
            sleep 2
          done
          echo "::error::El backend o la web no arrancaron"
          tail -n 50 "${{ runner.temp }}/backend.log" "${{ runner.temp }}/web.log"
          exit 1

      - name: Tipos de las pruebas E2E
        working-directory: web
        run: npm run e2e:tipos

      - name: Flujos E2E
        working-directory: web
        env:
          E2E_SALIDA: ${{ runner.temp }}/e2e/resultados
        run: npm run e2e

      - name: Registros y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trazas
          path: |
            ${{ runner.temp }}/e2e/resultados
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/web.log
          retention-days: 7

  diagramas:
    name: Diagramas PlantUML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verificar sintaxis
        run: |
          curl -sL -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          java -jar plantuml.jar -checkonly docs/diagramas/*.puml
